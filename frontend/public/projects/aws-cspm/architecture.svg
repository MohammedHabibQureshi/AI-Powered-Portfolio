<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="transparent"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">AWS Cloud Security Posture Monitor — System Architecture</text>

  <!-- ==================== TRIGGER LAYER ==================== -->
  <!-- EventBridge -->
  <rect x="180" y="56" width="220" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Amazon EventBridge</text>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#a16207">Daily cron 6 AM UTC</text>

  <!-- CloudTrail -->
  <rect x="560" y="56" width="220" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">AWS CloudTrail</text>
  <text x="670" y="100" text-anchor="middle" font-size="10" fill="#a16207">Real-time API event logs</text>

  <!-- Arrows: Triggers → Lambda -->
  <line x1="290" y1="120" x2="290" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="120" x2="670" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== LAMBDA LAYER ==================== -->
  <!-- Lambda outer box -->
  <rect x="140" y="160" width="680" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">AWS Lambda — Python 3.11 Scanner</text>

  <!-- IAM Checks -->
  <rect x="168" y="198" width="145" height="56" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="240" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">IAM Checks</text>
  <text x="240" y="238" text-anchor="middle" font-size="9" fill="#4b5563">5 CIS controls</text>

  <!-- S3 Checks -->
  <rect x="330" y="198" width="145" height="56" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="402" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">S3 Checks</text>
  <text x="402" y="238" text-anchor="middle" font-size="9" fill="#4b5563">4 CIS controls</text>

  <!-- EC2 Checks -->
  <rect x="492" y="198" width="145" height="56" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="564" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">EC2 Checks</text>
  <text x="564" y="238" text-anchor="middle" font-size="9" fill="#4b5563">5 EC2/SG controls</text>

  <!-- CloudTrail Checks -->
  <rect x="654" y="198" width="145" height="56" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="726" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">CloudTrail Checks</text>
  <text x="726" y="238" text-anchor="middle" font-size="9" fill="#4b5563">3 CIS controls</text>

  <!-- Arrow: Lambda → Risk Score -->
  <line x1="480" y1="270" x2="480" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== RISK SCORE ENGINE ==================== -->
  <rect x="330" y="310" width="300" height="52" rx="8" fill="#fef9ee" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Risk Score Engine</text>
  <text x="480" y="350" text-anchor="middle" font-size="9" fill="#a16207">CRITICAL / HIGH / MEDIUM / LOW — Security Score 0–100</text>

  <!-- Arrows: Risk Score → Outputs -->
  <line x1="350" y1="362" x2="200" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="362" x2="480" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="362" x2="760" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== OUTPUT LAYER ==================== -->
  <!-- DynamoDB -->
  <rect x="100" y="410" width="200" height="72" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Amazon DynamoDB</text>
  <text x="200" y="454" text-anchor="middle" font-size="10" fill="#6d28d9">Findings Store</text>
  <text x="200" y="470" text-anchor="middle" font-size="9" fill="#7c3aed">90-day TTL retention</text>

  <!-- SNS -->
  <rect x="380" y="410" width="200" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Amazon SNS</text>
  <text x="480" y="454" text-anchor="middle" font-size="10" fill="#be185d">Email + Slack Alerts</text>
  <text x="480" y="470" text-anchor="middle" font-size="9" fill="#db2777">Real-time notification fan-out</text>

  <!-- CloudWatch -->
  <rect x="660" y="410" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Amazon CloudWatch</text>
  <text x="760" y="454" text-anchor="middle" font-size="10" fill="#047857">Dashboard + Alarms</text>
  <text x="760" y="470" text-anchor="middle" font-size="9" fill="#059669">Custom metrics &amp; trend graphs</text>

  <!-- Arrows: Outputs → Security Hub -->
  <line x1="200" y1="482" x2="200" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="482" x2="480" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="482" x2="760" y2="520" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== SECURITY HUB ==================== -->
  <rect x="280" y="520" width="400" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="544" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">AWS Security Hub</text>
  <text x="480" y="562" text-anchor="middle" font-size="10" fill="#dc2626">Centralised Findings Aggregation</text>

  <!-- ==================== INFRASTRUCTURE (RIGHT SIDE) ==================== -->
  <!-- Terraform -->
  <rect x="740" y="540" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="830" y="562" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Terraform (IaC)</text>
  <text x="830" y="578" text-anchor="middle" font-size="9" fill="#15803d">Full stack deploy &amp; destroy</text>

  <!-- GitHub Actions -->
  <rect x="740" y="608" width="180" height="52" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="830" y="630" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">GitHub Actions</text>
  <text x="830" y="646" text-anchor="middle" font-size="9" fill="#0369a1">CI/CD — test on PR, deploy on merge</text>

  <!-- Arrow: Security Hub → Terraform (conceptual) -->
  <line x1="680" y1="548" x2="740" y2="560" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="40" y="620" width="560" height="80" rx="8" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.1" stroke-width="1"/>
  <text x="60" y="644" font-size="10" font-weight="700" fill="currentColor" text-opacity="0.7">LEGEND</text>

  <!-- Legend: Trigger -->
  <rect x="60" y="654" width="16" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="84" y="664" font-size="9" fill="currentColor" text-opacity="0.6">Trigger Source</text>

  <!-- Legend: Compute -->
  <rect x="200" y="654" width="16" height="12" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="224" y="664" font-size="9" fill="currentColor" text-opacity="0.6">Security Check Module</text>

  <!-- Legend: Processing -->
  <rect x="380" y="654" width="16" height="12" rx="2" fill="#fef9ee" stroke="#d97706" stroke-width="1"/>
  <text x="404" y="664" font-size="9" fill="currentColor" text-opacity="0.6">Processing Engine</text>

  <!-- Legend: Data flow -->
  <line x1="60" y1="686" x2="90" y2="686" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="690" font-size="9" fill="currentColor" text-opacity="0.6">Documented data flow</text>

  <!-- Legend: Dashed -->
  <line x1="280" y1="686" x2="310" y2="686" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="318" y="690" font-size="9" fill="currentColor" text-opacity="0.6">Supporting relationship</text>
</svg>
